<div class="container-fluid">
    <div class="row">
        <div class="col-md-12 text-end">
            <div class="top-panel d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center text-start">
                    <h6 class=" mb-0 me-4 small">Create/Update</h6>
                </div>
                <div class="form-group" *ngIf="permissions.canRegisterPatients()">
                    <button type="button" class="btn btn-primary btn-sm small" [routerLink]="['/patients/new']">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="22" height="22" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="me-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        Add Patient</button>
                </div>
            </div>
        </div>
    </div>
    <table class="table mt-2">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">PatientName</th>
                <th scope="col">Mobile No</th>
                <th scope="col">Status</th>
                <th scope="col">Blocked</th>
                <th scope="col">State</th>
                <th scope="col">City</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let patient of patientList; let i = index">
                <th scope="row">{{i+1}}</th>
                <td>{{patient.patientName}}</td>
                <td>{{patient.mobileNo}}</td>
                <td>{{patient.status}}</td>
                <td>
                    <span class="badge" [ngClass]="isPatientBlocked(patient) ? 'bg-danger' : 'bg-success'">
                        {{ isPatientBlocked(patient) ? 'Yes' : 'No' }}
                    </span>
                </td>
                <td>{{patient.state}}</td>
                <td>{{patient.city}}</td>
                <td><a type="button" class="btn btn-link p-0 fw-style me-3 text-dark fw-bold"
                        *ngIf="permissions.canManagePatients()" [routerLink]="['/patients', patient.patientId, 'edit']">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" width="20" height="20" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                        </svg>
                    </a>
                    <a *ngIf="permissions.canManagePatients()" type="button" class="btn btn-link p-0 fw-style me-3 text-dark fw-bold"
                        (click)="deletePatientById(patient.patientId)">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            width="20" height="20" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m6 4.125l2.25 2.25m0 0l2.25 2.25M12 13.875l2.25-2.25M12 13.875l-2.25 2.25M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z">
                            </path>
                        </svg>
                    </a>
                    <button *ngIf="permissions.canManagePatients()" type="button" class="btn btn-sm"
                        [ngClass]="isPatientBlocked(patient) ? 'btn-outline-success' : 'btn-outline-warning'"
                        (click)="togglePatientBlock(patient)">
                        {{ isPatientBlocked(patient) ? 'Unblock' : 'Block' }}
                    </button>
                    <span *ngIf="!permissions.canManagePatients()" class="text-muted small">View only</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
