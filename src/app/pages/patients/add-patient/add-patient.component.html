<div class="container-fluid">
    <div class="row">
        <div class="col-md-12 text-end">
            <div class="top-panel d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center text-start">
                    <h6 class="mb-0 me-4 small">{{ isPublicRegistration ? 'Patient Registration' : (buttonText || 'Save') + ' Patient' }}</h6>
                </div>
                <div class="text-end">
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                        [routerLink]="[isPublicRegistration ? '/login' : '/patients']">
                        Back
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <form [formGroup]="patientForm" class="mt-2">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Patient Name</label>
                        <input formControlName="patientName" class="form-control" />
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Mobile No</label>
                        <input formControlName="mobileNo" class="form-control" type="tel" maxlength="10" />
                    </div>

                    <div class="col-md-4 mb-3" *ngIf="!isPublicRegistration">
                        <label>Status</label>
                        <select formControlName="status" class="form-control">
                            <option value="">-- Select --</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label>Illness History</label>
                        <input formControlName="illnessHistory" class="form-control" />
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Gender</label>
                        <select formControlName="gender" class="form-control">
                            <option value="">-- Select --</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <div class="form-outline">
                            <label>State</label>
                            <ng-select [items]="stateList" [multiple]="false" bindLabel="name" bindValue="name"
                                placeholder="Select State" formControlName="state"
                                (change)="onSelectStateLoadCities($event?.name || $event)">
                            </ng-select>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="form-outline">
                            <label>City</label>
                            <ng-select [items]="cityList" [multiple]="false" placeholder="Select City"
                                formControlName="city">
                            </ng-select>
                        </div>
                    </div>
                </div>

                <div class="row align-items-end">
                    <div class="col-md-3 mb-3" formGroupName="attachment">
                        <label>Upload Photo</label>
                        <input type="file" class="form-control" (change)="onPhotoSelected($event)" accept="image/*" />
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="d-block">Preview</label>
                        <img [src]="photoPreview || defaultPhoto" alt="Selected Photo" class="img-thumbnail"
                            style="max-width: 250px; max-height: 240px;" />
                    </div>
                    <div class="col-md-3 mb-3 form-check" *ngIf="!isPublicRegistration">
                        <input class="form-check-input" type="checkbox" formControlName="isBlocked" id="isBlocked">
                        <label class="form-check-label" for="isBlocked">Block patient</label>
                    </div>
                </div>

                <button type="button" class="btn btn-success" (click)="submit()"
                    [disabled]="patientForm.invalid">Submit</button>
            </form>
        </div>
    </div>
</div>
