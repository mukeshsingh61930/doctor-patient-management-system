<!-- Add this in your login.component.html or any page -->
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-4 shadow rounded" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>
        <form [formGroup]="loginForm">
            <div class="mb-3">
                <label for="userId" class="form-label">User Id</label>
                <input type="text" class="form-control" id="userId" name="userId" formControlName="userId">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" formControlName="password">
            </div>
            <button type="button" class="btn btn-primary w-100" (click)="login()">Login</button>
        </form>
        <div class="text-center mt-3">
            <small>Don't have an account? <a routerLink="/register">Register</a></small>
        </div>
    </div>
</div>
