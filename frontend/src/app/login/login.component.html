<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-mark">DP</span>
            <div>
                <h3>Clinic Console</h3>
                <p>Sign in to manage appointments and patient care.</p>
            </div>
        </div>

        <form [formGroup]="loginForm" class="login-form">
            <div>
                <label for="userId" class="form-label">User Id</label>
                <input type="text" class="form-control" id="userId" name="userId" formControlName="userId">
            </div>
            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" formControlName="password">
            </div>
            <button type="button" class="btn btn-primary w-100" (click)="login()">Login</button>
        </form>

        <div class="register-link">
            <small>Don't have an account? <a routerLink="/register">Register</a></small>
        </div>
    </div>
</div>
