<header class="app-header-shell">
    <div class="header-left">
        <button type="button" class="menu-trigger" (click)="toggleSideMenu()" aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a class="brand-block" routerLink="/dashboard" aria-label="Clinic Console dashboard">
            <span class="brand-mark">DP</span>
            <span class="brand-copy">
                <strong>Clinic Console</strong>
                <small>Doctor Patient System</small>
            </span>
        </a>
    </div>

    <nav class="header-nav" aria-label="Primary navigation">
        <a routerLink="/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
            Dashboard
        </a>
        <a *ngIf="permissions.canViewPatients()" routerLink="/patients" routerLinkActive="is-active">
            Patients
        </a>
        <a routerLink="/appointments" routerLinkActive="is-active">
            Appointments
        </a>
    </nav>

    <div class="header-user">
        <div class="user-chip">
            <span class="user-avatar">{{ getInitials() }}</span>
            <span class="user-copy">
                <strong>{{ getDisplayName() }}</strong>
                <small>{{ authService.getRole() }}</small>
            </span>
        </div>
        <button type="button" class="logout-mini" (click)="logout()">Logout</button>
    </div>
</header>
